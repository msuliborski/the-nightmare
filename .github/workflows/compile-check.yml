name: Compile check

# Fast C# compile check against the Unity 2018.4 assemblies. No Unity license needed.
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: unityci/editor:ubuntu-2018.4.3f1-base-3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
      - name: Compile all scripts (Windows / macOS / Linux defines + Editor)
        run: bash .github/ci/compile-check.sh

  workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .github
      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
